note: "Two real documents. (1) www.sound.ag serves an RFC 9116 security.txt with Contact and Expiration (required\
  \ fields present); its optional Policy, Encryption and Acknowledgements URLs all 404 and the Contact is the site's\
  \ web agency (One Design Company, per /humans.txt), so it reads as the CMS build's boilerplate rather than a company\
  \ security program. (2) dealerportal.sound.ag, a Salesforce Experience Cloud community (DNS CNAME to *.live.siteforce.com,\
  \ sfdc robots.txt), serves the standard Salesforce OIDC discovery document at /.well-known/openid-configuration\
  \ \u2014 first-party host, platform-authored document, scopes are Salesforce's. Every other path 404s on the marketing\
  \ host and 401s on the portal. api./developer./docs.sound.ag resolve via a wildcard CNAME to Pardot (go.pardot.com)\
  \ and fail the TLS handshake \u2014 they are not hosts. go.sound.ag (Pardot) 200s every path by redirecting to\
  \ www.sound.ag/ and was excluded as a catch-all."
