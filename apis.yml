  reason: not-a-software-company
  detail: >-
    Sound Agriculture sells physical crop-nutrition biologicals (SOURCE, BLUEPRINT, INFLECT) through dealers
    and runs a plant-breeding lab; its whole public surface is a Craft CMS marketing site whose API-shaped
    paths 404, its api./developer./docs. subdomains are a wildcard CNAME to Pardot with no TLS certificate,
    its only authenticated host is a Salesforce Experience Cloud dealer portal that 302s to /login, and
    its GitHub org holds lab-automation code and a Postman collection for Leaf Agriculture's API rather
    than any Sound API.
