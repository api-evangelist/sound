aid: sound
name: Sound Agriculture
description: >-
  Sound Agriculture is an Emeryville, California agriculture company founded in 2013 by Eric Davidson
  and Travis Bayer that sells nature-based crop nutrition products to row-crop growers through an independent
  dealer network: SOURCE, a foliar-applied soil activator that stimulates soil microbes to supply nitrogen
  and phosphorus; BLUEPRINT, an arbuscular mycorrhizal fungi inoculant; and INFLECT. It also runs an on-demand
  breeding program that tunes plant gene expression epigenetically without editing DNA. Sound Agriculture
  is not a software company and publishes no developer program, API, SDK or machine-readable contract;
  its only authenticated surface is a Salesforce Experience Cloud dealer portal at dealerportal.sound.ag.
